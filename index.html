<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Будешь моей девушкой?</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
    }
    #question {
      font-size: 2rem;
      margin-bottom: 30px;
    }
    .btn {
      font-size: 1.3rem;
      padding: 10px 28px;
      margin: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.23s, background 0.2s;
      position: relative;
    }
    #yesBtn:hover {
      transform: scale(1.3);
      background: #49e83e;
    }
    #yesBtn:active {
      transform: scale(1.15);
    }
    #noBtn {
      background: #f35e5e;
      color: white;
      position: absolute;
    }
    #yesBtn {
      background: #67cf6e;
      color: white;
    }
    #result {
      margin-top: 50px;
      font-size: 2rem;
      color: #20ba1b;
      display: none;
    }
    #btn-container {
      position: relative;
      height: 100px;
      display: inline-block;
      width: 330px;
    }
  </style>
</head>
<body>
  <div id="question">Так че будешь моей девушкой?</div>
  <div id="btn-container">
    <button class="btn" id="yesBtn">Да</button>
    <button class="btn" id="noBtn" style="left:185px;top:0;">Нет</button>
  </div>
  <div id="result">Ну вот и чётко 😎</div>
<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const result = document.getElementById('result');
  const container = document.getElementById('btn-container');
  let width = container.offsetWidth - noBtn.offsetWidth;
  let height = container.offsetHeight - noBtn.offsetHeight;

  noBtn.addEventListener('mouseenter', function() {
    const randX = Math.floor(Math.random() * width);
    const randY = Math.floor(Math.random() * height);
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  });

  yesBtn.addEventListener('click', function() {
    result.style.display = 'block';
    container.style.display = 'none';
    document.getElementById('question').style.display = 'none';
  });
</script>
</body>
</html>
